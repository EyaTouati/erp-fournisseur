spring.application.name=fournisseur

# Base PostgreSQL locale (chaque membre a sa propre base erp_fournisseur)
# Port 5432 par defaut ; si votre PostgreSQL utilise un autre port : variable DB_PORT
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/erp_fournisseur
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# Les tables sont creees uniquement par Flyway ; Hibernate verifie seulement
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway : scripts dans src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.out-of-order=true
